name: Gerar APK TWM

# Roda quando você clica em "Run workflow" ou dá push na branch main
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Java (necessário para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências do projeto
        run: npm install

      - name: Adicionar plataforma Android
        run: npx cap add android

      - name: Adicionar permissão de GPS em segundo plano
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml

      - name: Gerar ícones do app
        run: |
          npm install -D @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar o APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: TWM-DataLink-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
