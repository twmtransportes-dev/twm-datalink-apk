<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TWM DataLink</title>
  <style>
    html,body{margin:0;height:100%;background:#1a1030;color:#fff;
      font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
      display:flex;align-items:center;justify-content:center;text-align:center}
    .box{padding:24px}
    .logo{width:84px;height:84px;border-radius:20px;background:#7C3AED;
      display:flex;align-items:center;justify-content:center;
      font-weight:800;font-size:26px;margin:0 auto 16px}
    .msg{opacity:.7;font-size:14px}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">TWM</div>
    <div>TWM DataLink</div>
    <div class="msg" id="msg">Carregando...</div>
  </div>

  <script>
  /* Este index só existe dentro do APK. Ele:
     1. Inicia o GPS nativo em segundo plano (roda com o app fechado).
     2. Abre o site, onde estão todos os módulos.
     O site em si continua sendo o mesmo do GitHub — nada é duplicado aqui. */

  var SITE = 'https://twmtransportes-dev.github.io/central-operacoes-twm/';
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxZ5P_l0cBM3g79srBUcxwdpMkKSHeE8d89Ksp9uFjhw4YnD2-m5rH8MVMyB5rDWRX9wQ/exec';

  function _vp()     { return (localStorage.getItem('twm_vp_tablet')    || '').toUpperCase(); }
  function _placa()  { return (localStorage.getItem('twm_placa_tablet') || '').toUpperCase(); }
  function _device() {
    var id = localStorage.getItem('twm_device_id');
    if (!id) {
      id = 'TBL-' + (Math.random().toString(36).slice(2,8) +
                     Date.now().toString(36).slice(-4)).toUpperCase();
      localStorage.setItem('twm_device_id', id);
    }
    return id;
  }
  function _nome() {
    try { return (JSON.parse(localStorage.getItem('twm_usuario')||'{}').nome) || ''; }
    catch (e) { return ''; }
  }

  function enviarPos(lat, lng, acc) {
    var frota = _vp();
    if (!frota) return;   // sem VP configurada não envia
    var qs = '?action=salvarLocalizacao'
      + '&nome='   + encodeURIComponent(_nome())
      + '&frota='  + encodeURIComponent(frota)
      + '&placa='  + encodeURIComponent(_placa())
      + '&device=' + encodeURIComponent(_device())
      + '&lat=' + lat + '&lng=' + lng
      + '&precisao=' + Math.round(acc || 0)
      + '&ts=' + encodeURIComponent(new Date().toISOString())
      + '&_t=' + Date.now();
    fetch(SCRIPT_URL + qs, { method:'GET', redirect:'follow' }).catch(function(){});
  }

  // Inicia o GPS em segundo plano via plugin do Capacitor
  function iniciarGpsNativo() {
    try {
      var BG = Capacitor.Plugins.BackgroundGeolocation;
      if (!BG) { document.getElementById('msg').textContent = 'Abrindo...'; return abrirSite(); }

      BG.addWatcher({
        backgroundMessage: 'Rastreamento TWM ativo',
        backgroundTitle: 'TWM DataLink',
        requestPermissions: true,
        stale: false,
        distanceFilter: 50   // envia a cada ~50m de deslocamento
      }, function (location, error) {
        if (error) return;
        if (location) enviarPos(location.latitude, location.longitude, location.accuracy);
      }).then(function () {
        abrirSite();
      });
    } catch (e) {
      abrirSite();
    }
  }

  function abrirSite() {
    // abre o site com todos os módulos
    window.location.href = SITE;
  }

  // espera o Capacitor carregar
  document.addEventListener('deviceready', iniciarGpsNativo, false);
  // fallback: se não for APK (rodando no navegador), só abre o site
  setTimeout(function () {
    if (!window.Capacitor || !window.Capacitor.Plugins) abrirSite();
  }, 2500);
  </script>
</body>
</html>
